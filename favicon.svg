<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2420"/>
      <stop offset="100%" stop-color="#121714"/>
    </linearGradient>
  </defs>
  <!-- Dark Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Schedule Grid Tiles -->
  <g transform="translate(106, 106)">
    <!-- Top row -->
    <rect x="0" y="0" width="94" height="94" rx="16" fill="#5CC49A"/>
    <rect x="103" y="0" width="94" height="94" rx="16" fill="#FF8A6B"/>
    <rect x="206" y="0" width="94" height="94" rx="16" fill="#9BB0C6"/>

    <!-- Middle row -->
    <rect x="0" y="103" width="94" height="94" rx="16" fill="#FF8A6B"/>
    <rect x="103" y="103" width="94" height="94" rx="16" fill="#9BB0C6"/>
    <rect x="206" y="103" width="94" height="94" rx="16" fill="#5CC49A"/>

    <!-- Bottom row -->
    <rect x="0" y="206" width="94" height="94" rx="16" fill="#9BB0C6"/>
    <rect x="103" y="206" width="94" height="94" rx="16" fill="#5CC49A"/>
    <rect x="206" y="206" width="94" height="94" rx="16" fill="#FF8A6B"/>

    <!-- Athletic Stadium Running Track Overlay -->
    <path d="M 50 60 C 250 -30, 250 330, 50 240 C -30 200, -30 100, 50 60 Z" fill="none" stroke="#121714" stroke-width="12" opacity="0.6"/>
    <rect x="30" y="30" width="240" height="240" rx="90" fill="none" stroke="#121714" stroke-width="14" opacity="0.45"/>
    <rect x="52" y="52" width="196" height="196" rx="70" fill="none" stroke="#121714" stroke-width="12" opacity="0.35"/>
  </g>
</svg>
