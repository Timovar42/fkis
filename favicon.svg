<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2420"/>
      <stop offset="100%" stop-color="#121714"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A6B"/>
      <stop offset="100%" stop-color="#F0775A"/>
    </linearGradient>
  </defs>
  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Schedule Grid Frame (#5CC49A) -->
  <rect x="116" y="116" width="280" height="280" rx="20" fill="none" stroke="#5CC49A" stroke-width="18" opacity="0.9"/>
  <!-- Grid Dividers -->
  <line x1="209" y1="116" x2="209" y2="396" stroke="#5CC49A" stroke-width="18" opacity="0.8"/>
  <line x1="303" y1="116" x2="303" y2="396" stroke="#5CC49A" stroke-width="18" opacity="0.8"/>
  <line x1="116" y1="209" x2="396" y2="209" stroke="#5CC49A" stroke-width="18" opacity="0.8"/>
  <line x1="116" y1="303" x2="396" y2="303" stroke="#5CC49A" stroke-width="18" opacity="0.8"/>

  <!-- Athletic Pulse & Arrow Line (#FF8A6B) -->
  <circle cx="116" cy="256" r="22" fill="#FF8A6B"/>
  <path d="M 138 256
           Q 175 256 195 282
           T 240 180
           L 272 334
           Q 296 260 340 256
           L 404 200"
        fill="none" stroke="url(#pulseGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow Head -->
  <polygon points="418,188 376,192 400,234" fill="#FF8A6B"/>
</svg>
