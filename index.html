<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17211D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Расписание · 1 курс · Физическая реабилитация</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EDEFEC;--paper:#FAFAF8;--ink:#17211D;--mute:#65706A;--line:#D5DAD5;
  --r:#44505E;--g:#1F6B4E;--s:#CF4A2C;
  --hero:#17211D;--hero-fg:#F3F5F1;--hero-acc:#FF8A6B;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#121714;--paper:#1B221E;--ink:#ECEFEA;--mute:#97A39B;--line:#2B352F;
  --r:#9BB0C6;--g:#5CC49A;--s:#F0775A;--hero:#2A352E;
}}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:Onest,system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.4;
  background-image:repeating-linear-gradient(90deg,transparent 0 95px,color-mix(in srgb,var(--ink) 5%,transparent) 95px 96px);
  background-attachment:fixed;
}
.wrap{
  max-width:600px;margin:0 auto;
  padding:max(14px,env(safe-area-inset-top)) 14px max(32px,env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--s);outline-offset:2px}

header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:4px 2px 10px}
h1{font:700 1.25rem/1 var(--disp);letter-spacing:.02em;text-transform:uppercase}
header p{font-size:.78rem;color:var(--mute);margin-top:3px}
header time{font-size:.85rem;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.offline-banner{
  display:none;font-size:.76rem;color:var(--mute);margin-top:4px;
}
.offline-banner.active{display:block}

/* week switcher */
.week-bar{
  display:flex;align-items:center;justify-content:space-between;gap:4px;
  margin:2px 0 12px;background:color-mix(in srgb,var(--ink) 6%,transparent);
  padding:4px;border-radius:12px;
}
.w-nav{
  width:32px;height:38px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-weight:700;font-size:1.2rem;color:var(--mute);
  transition:all .15s ease;flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
.w-nav:disabled{opacity:.25;cursor:default}
.w-nav:not(:disabled):active{background:color-mix(in srgb,var(--ink) 10%,transparent)}
.w-pills{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;flex:1}
.w-pill{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5px 2px;border-radius:8px;font-weight:600;font-size:.8rem;color:var(--mute);
  transition:all .15s ease;line-height:1.2;-webkit-tap-highlight-color:transparent;
}
.w-pill .w-rng{font-size:.66rem;font-weight:400;opacity:.8;white-space:nowrap}
.w-pill[aria-selected=true]{
  background:var(--paper);color:var(--ink);
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}

/* hero */
.hero{
  background:var(--hero);color:var(--hero-fg);border-radius:18px;
  padding:16px 18px 18px;cursor:pointer;position:relative;overflow:hidden;user-select:none;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  transition:transform .15s ease;
  -webkit-tap-highlight-color:transparent;
}
.hero:active{transform:scale(.99)}
.hero .lbl{font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.75}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:6px}
.h-nm{font-weight:600;font-size:1.15rem;line-height:1.25}
.h-pl{margin-top:4px;color:var(--hero-acc);font-weight:600;font-size:.95rem}
.cd{text-align:right;flex-shrink:0}
.cd b{display:block;font:700 3.4rem/.85 var(--disp);font-variant-numeric:tabular-nums}
.cd span{font-size:.72rem;opacity:.75}
.pr{height:4px;border-radius:2px;background:rgb(255 255 255/.16);margin-top:14px;overflow:hidden}
.pr i{display:block;height:100%;background:var(--hero-acc);border-radius:2px;transition:width .6s ease}
.then{margin-top:12px;font-size:.82rem;opacity:.8}
.hero[data-st=live]::after{
  content:'';position:absolute;top:16px;right:18px;width:9px;height:9px;border-radius:50%;
  background:var(--hero-acc);animation:blink 1.5s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* tabs */
.tabs{
  display:grid;grid-template-columns:repeat(6,1fr) 1.05fr 1.05fr;gap:3px;
  margin:14px 0 14px;padding:4px 3px;border-radius:14px;
  background:color-mix(in srgb,var(--ink) 7%,transparent);
}
.tab{
  border-radius:10px;padding:6px 1px 6px;font-weight:600;color:var(--mute);
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
  transition:all .15s ease;-webkit-tap-highlight-color:transparent;min-width:0;
}
.tab-dn{font-size:.85rem;line-height:1}
.tab-num{font-size:.68rem;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums;line-height:1}
.tab[aria-selected=true]{
  background:var(--paper);color:var(--ink);
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.tab[aria-selected=true] .tab-num{color:var(--ink);font-weight:600}
.tab.today::after{
  content:'';position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--s);
}
.tab-badge{
  font-size:.62rem;font-weight:700;padding:1px 4px;border-radius:6px;
  background:var(--hero-acc);color:var(--hero);line-height:1;margin-top:1px;
}
.ticks{display:flex;gap:2px;margin-top:1px}
.ticks i{width:4px;height:10px;border-radius:2px;background:var(--line);transition:background .2s}
.ticks i.on{background:var(--v)}
.tab svg{width:15px;height:15px;margin:1px 0}
.v-r{--v:var(--r)}.v-g{--v:var(--g)}.v-s{--v:var(--s)}

/* day */
.dh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dh h2{font:700 1.75rem/1 var(--disp);text-transform:uppercase}
.dh span{color:var(--mute);font-size:.85rem}
.dh button{
  margin-left:auto;border:1px solid var(--line);background:var(--paper);
  border-radius:8px;padding:5px 11px;font-size:.8rem;font-weight:500;color:var(--mute);
  transition:border-color .15s,color .15s;
}
.dh button:active{background:color-mix(in srgb,var(--ink) 6%,var(--paper))}
.hint{font-size:.85rem;color:var(--mute);margin:6px 0 14px}
.hint b{color:var(--s);font-weight:600}
.in-l{animation:inl .18s ease-out}.in-r{animation:inr .18s ease-out}
@keyframes inl{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

/* cards */
.card{
  background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--v);
  border-radius:10px;margin-bottom:10px;overflow:hidden;position:relative;
  transition:border-color .2s,box-shadow .2s;
}
.card-h{
  all:unset;box-sizing:border-box;width:100%;display:grid;
  grid-template-columns:62px 1fr 16px;gap:12px;padding:13px 12px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.card-h:focus-visible{outline:2px solid var(--s);outline-offset:-3px}
.tm b{display:block;font:700 1.85rem/1 var(--disp);font-variant-numeric:tabular-nums}
.tm i{font-style:normal;font-size:.8rem;color:var(--mute)}
.nm{font-weight:600;line-height:1.25}
.tag{
  font-size:.7rem;font-weight:600;color:var(--mute);border:1px solid var(--line);
  border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:1px;
}
.tag-cancel{
  background:color-mix(in srgb,var(--s) 15%,var(--paper));color:var(--s);
  border:1px solid color-mix(in srgb,var(--s) 35%,transparent);
  font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;
}
.tag-replace{
  background:color-mix(in srgb,var(--g) 15%,var(--paper));color:var(--g);
  border:1px solid color-mix(in srgb,var(--g) 35%,transparent);
  font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;
}
.tag-hw{
  background:color-mix(in srgb,var(--hero-acc) 18%,var(--paper));color:var(--hero-acc);
  border:1px solid color-mix(in srgb,var(--hero-acc) 40%,transparent);
  font-size:.66rem;font-weight:700;padding:1px 5px;border-radius:4px;flex-shrink:0;
}
.card-hw-preview{
  display:flex;align-items:center;gap:6px;margin-top:5px;
  background:color-mix(in srgb,var(--hero-acc) 10%,var(--paper));
  padding:3px 6px;border-radius:6px;border:1px solid color-mix(in srgb,var(--hero-acc) 25%,transparent);
}
.card-hw-text{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:.78rem;color:var(--ink);
}
.hw-done-text{text-decoration:line-through;opacity:.6}

.pl{color:var(--v);font-weight:600;font-size:.9rem;margin-top:3px}
.th{color:var(--mute);font-size:.83rem;margin-top:1px}
.dot{
  display:none;width:7px;height:7px;border-radius:50%;background:var(--s);
  margin-left:6px;vertical-align:2px;box-shadow:0 0 0 2px var(--paper);
}
.has .dot{display:inline-block}

.chev{
  width:8px;height:8px;border:solid var(--mute);border-width:0 2px 2px 0;
  transform:rotate(45deg);margin-top:7px;transition:transform .22s ease;
}
.open .chev{transform:rotate(-135deg)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden;min-height:0}
.mi{padding:0 14px 14px 86px;font-size:.88rem}
.mi p{margin-bottom:8px;line-height:1.35}
.mi small{color:var(--mute);display:block;margin-top:2px}

/* homework box inside card */
.hw-box{
  background:color-mix(in srgb,var(--hero-acc) 8%,var(--paper));
  border:1px solid color-mix(in srgb,var(--hero-acc) 30%,var(--line));
  border-radius:8px;padding:10px;margin:6px 0 10px;
}
.hw-box-head{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.hw-box-title{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink)}
.hw-due{font-size:.75rem;color:var(--mute)}
.hw-due.due-urgent{color:var(--s);font-weight:700}
.hw-box-body{font-size:.88rem;line-height:1.45;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.hw-box-foot{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  margin-top:8px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);
}
.hw-done-label{
  display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
}
.hw-done-label input{width:16px;height:16px;accent-color:var(--g);cursor:pointer}
.hw-link-btn{
  font-size:.76rem;font-weight:600;color:var(--g);text-decoration:none;
  border:1px solid color-mix(in srgb,var(--g) 35%,transparent);border-radius:6px;
  padding:3px 8px;background:var(--paper);display:inline-flex;align-items:center;gap:4px;
}
.hw-link-btn:active{background:color-mix(in srgb,var(--g) 10%,var(--paper))}

/* notes UI */
.note-box{
  background:color-mix(in srgb,var(--ink) 4%,var(--bg));
  border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:4px;
}
.note-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.note-title{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.note-state{font-size:.72rem;color:var(--mute);transition:color .2s}
.mi textarea{
  width:100%;min-height:64px;resize:vertical;
  border:1px solid var(--line);border-radius:6px;
  background:var(--paper);color:var(--ink);
  font:inherit;font-size:16px;line-height:1.45;padding:8px 10px;
}
.mi textarea:focus{border-color:var(--v);outline:none}
.note-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.note-hint{font-size:.72rem;color:var(--mute)}
.note-btn{
  font-size:.76rem;font-weight:600;border:1px solid var(--line);border-radius:6px;
  padding:4px 9px;background:var(--paper);color:var(--mute);transition:all .15s;
}
.note-btn:active{background:color-mix(in srgb,var(--ink) 8%,var(--paper))}
.note-btn.del{color:var(--s);border-color:color-mix(in srgb,var(--s) 35%,transparent)}

.bar{display:none;height:3px;background:var(--line)}.bar i{display:block;height:100%;background:var(--v)}
.card.now{background:color-mix(in srgb,var(--v) 9%,var(--paper));border-color:var(--v)}
.card.now .bar{display:block}
.card.now .tm b::after{content:' идёт';font:600 .7rem Onest;color:var(--v);margin-left:2px}
.card.past{opacity:.5}
.card.canceled{opacity:.65;border-left-color:var(--s)}
.card.canceled .nm{text-decoration:line-through}
.win{
  border:1px dashed var(--line);border-radius:10px;padding:8px 12px;
  margin-bottom:10px;color:var(--mute);font-size:.85rem;text-align:center;
}

/* week view */
.wk{display:grid;grid-template-columns:24px repeat(6,1fr);gap:4px}
.wk .h{text-align:center;font-weight:600;font-size:.8rem;color:var(--mute);padding-bottom:2px}
.wk .h.today{color:var(--s);font-weight:700}
.rl{font:700 1.25rem var(--disp);color:var(--mute);display:flex;align-items:center;justify-content:center}
.c{
  min-height:66px;border:0;border-left:3px solid var(--v);border-radius:6px;
  background:color-mix(in srgb,var(--v) 15%,var(--paper));
  font:600 .68rem/1.2 Onest;text-align:left;padding:5px 4px;
  overflow:hidden;word-break:break-word;hyphens:auto;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.c.e{background:none;border:1px dashed var(--line);cursor:default}
.c.cur{outline:2px solid var(--ink);outline-offset:1px}
.c.has-hw::after{
  content:'';position:absolute;top:4px;right:4px;width:6px;height:6px;
  border-radius:50%;background:var(--hero-acc);
}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:.8rem;color:var(--mute)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--v);margin-right:5px;vertical-align:-1px}

/* all homework tab view */
.hw-view-item{
  background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--v);
  border-radius:10px;padding:12px 14px;margin-bottom:10px;position:relative;
}
.hw-view-item.is-done{opacity:.65}
.hw-view-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.hw-view-title{font-weight:600;font-size:1rem;line-height:1.25}
.hw-view-date{font-size:.8rem;color:var(--mute);margin-top:2px}
.hw-jump-btn{
  font-size:.76rem;font-weight:600;color:var(--mute);border:1px solid var(--line);
  border-radius:6px;padding:3px 9px;background:var(--bg);cursor:pointer;flex-shrink:0;
  transition:all .15s ease;
}
.hw-jump-btn:active{background:var(--paper);color:var(--ink)}

footer{margin-top:32px;font-size:.76rem;color:var(--mute);text-align:center;line-height:1.6}
.toast{
  position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;
  font-size:.85rem;font-weight:500;opacity:0;pointer-events:none;transition:.22s ease;z-index:99;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:440px){
  .wrap{padding-left:10px;padding-right:10px}
  .mi{padding-left:12px}
  .tm b{font-size:1.65rem}
  .card-h{grid-template-columns:54px 1fr 14px;gap:10px;padding:12px 10px}
  .tab-dn{font-size:.82rem}
  .ticks i{width:3px;height:9px}
  .cd b{font-size:3rem}
  .w-pill{font-size:.76rem}
  .w-pill .w-rng{font-size:.62rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Расписание</h1>
      <p>1 курс · физическая реабилитация</p>
      <div id="offline-badge" class="offline-banner">● Нет связи, показана сохранённая версия</div>
    </div>
    <time id="dt"></time>
  </header>

  <!-- Week Switcher -->
  <div class="week-bar">
    <button class="w-nav" id="w-prev" aria-label="Предыдущая неделя">‹</button>
    <div class="w-pills" id="w-pills">
      <button class="w-pill" data-w="0">Прошлая<span class="w-rng" id="wrng-0">...</span></button>
      <button class="w-pill" data-w="1" aria-selected="true">Эта<span class="w-rng" id="wrng-1">...</span></button>
      <button class="w-pill" data-w="2">Следующая<span class="w-rng" id="wrng-2">...</span></button>
    </div>
    <button class="w-nav" id="w-next" aria-label="Следующая неделя">›</button>
  </div>

  <section class="hero" id="hero" role="button" tabindex="0" aria-live="polite"></section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="День недели"></nav>
  <main id="view"></main>
  <footer>
    Факультет физической культуры и спорта · АФК · 1 семестр
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* Built-in fallback */
const DEFAULT_SCHEDULE = {
  version: 2,
  bells: [
    ['08:00', '09:30'],
    ['09:40', '11:10'],
    ['11:25', '12:55'],
    ['13:05', '14:35']
  ],
  subjects: [
    { id: 's_eng', name: 'Иностранный язык: английский', short: 'Англ. яз.', type: '', teacher: 'Шульга Светлана Ярославовна', place: 'к2 · 315', venue: 'r' },
    { id: 's_afv_lk', name: 'Адаптивное ФВ дошкольников и школьников', short: 'АФВ дошк.', type: 'лк', teacher: 'Торопчина Людмила Генадьевна', place: 'к2 · 315', venue: 'r' },
    { id: 's_afv_pr', name: 'Адаптивное ФВ дошкольников и школьников', short: 'АФВ дошк.', type: 'пр', teacher: 'Торопчина Людмила Генадьевна', place: 'к2 · 315', venue: 'r' },
    { id: 's_fks_lk', name: 'Физическая культура и спорт', short: 'ФКиС', type: 'лк', teacher: 'Кольцов Денис Александрович', place: 'к2 · 315', venue: 'r' },
    { id: 's_fks_pr', name: 'Физическая культура и спорт', short: 'ФКиС', type: 'пр', teacher: '—', place: 'Городской стадион', venue: 's' },
    { id: 's_foot', name: 'Футбол и методика преподавания', short: 'Футбол', type: '', teacher: 'Мамков Олег Михайлович', place: 'Городской стадион', venue: 's' },
    { id: 's_lang', name: 'Официальный язык: Молд. / Укр. яз.', short: 'Гос. язык', type: '', teacher: 'Мазепа Татьяна Андреевна / Якимович Елена', place: 'к2 · 204 / 205', venue: 'r' },

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/* Timezone & Date helpers (Europe/Chisinau) */
function getChisinauDateParts(d = new Date()) {
  try {
    const formatter = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Chisinau',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour12: false
    });
    const parts = formatter.formatToParts(d);
    const p = {};
    parts.forEach(pt => p[pt.type] = pt.value);
    return {
      year: parseInt(p.year, 10),
      month: parseInt(p.month, 10),
      day: parseInt(p.day, 10),
      dateStr: `${p.year}-${p.month}-${p.day}`
    };
  } catch (e) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return { year: y, month: d.getMonth() + 1, day: d.getDate(), dateStr: `${y}-${m}-${day}` };
  }
}

function addDays(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + days, 12, 0, 0));
  const ry = dt.getUTCFullYear();
  const rm = String(dt.getUTCMonth() + 1).padStart(2, '0');
  const rd = String(dt.getUTCDate()).padStart(2, '0');
  return `${ry}-${rm}-${rd}`;
}

function getMonday(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
  const dow = (dt.getUTCDay() + 6) % 7; // Mon=0..Sun=6
  return addDays(dateStr, -dow);
}

function computeThreeMondays() {
  const todayStr = getChisinauDateParts().dateStr;
  const curMon = getMonday(todayStr);
  return [addDays(curMon, -7), curMon, addDays(curMon, 7)];
}

function formatRange(monStr) {
  const satStr = addDays(monStr, 5);
  const [, m1, d1] = monStr.split('-').map(Number);
  const [, m2, d2] = satStr.split('-').map(Number);
  if (m1 === m2) {
    return `${d1}–${d2} ${MONTHS_ROD[m1 - 1]}`;
  }
  return `${d1} ${MONTHS_ROD[m1 - 1]} – ${d2} ${MONTHS_ROD[m2 - 1]}`;
}

function formatDue(dueStr) {
  if (!dueStr) return '';
  const [y, m, d] = dueStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
  const dow = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][dt.getUTCDay()];
  return `${dow}, ${d} ${MONTHS_ROD[m - 1]}`;
}

function getDaysRemaining(targetDateStr) {
  const todayStr = getChisinauDateParts().dateStr;
  const [y1, m1, d1] = todayStr.split('-').map(Number);
  const [y2, m2, d2] = targetDateStr.split('-').map(Number);
  const t1 = Date.UTC(y1, m1 - 1, d1);
  const t2 = Date.UTC(y2, m2 - 1, d2);
  return Math.round((t2 - t1) / 86400000);
}

/* Time & Today */
const nowM = () => {
  const now = new Date();
  try {
    const formatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Europe/Chisinau',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });
    const [h, m] = formatter.format(now).split(':').map(Number);
    return h * 60 + m;
  } catch (e) {
    return now.getHours() * 60 + now.getMinutes();
  }
};

const getTodayDow = () => {
  const todayStr = getChisinauDateParts().dateStr;
  const [y, m, d] = todayStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
  return (dt.getUTCDay() + 6) % 7; // Mon=0..Sun=6
};

function getActiveMonday() {
  return weekMondays[selectedWeekIndex] || weekMondays[1];

function getDateForSlot(dayIndex) {
  return addDays(getActiveMonday(), dayIndex);
}

function getSlotData(dayIndex, slotIndex, specificMonday = null) {
  const mon = specificMonday || getActiveMonday();
  const dateStr = addDays(mon, dayIndex);
  const weekObj = scheduleWeeks[mon];
  let subId = null;
  if (weekObj?.days?.[dayIndex]) {
    subId = weekObj.days[dayIndex][slotIndex];
  } else if (defaultTemplate?.[dayIndex]) {
    subId = defaultTemplate[dayIndex][slotIndex];
  }
  const base = subId ? (subjectsMap[subId] || null) : null;
  const ov = overrides.find(o => o.date === dateStr && o.slot === slotIndex) || null;

  if (!ov) return { subject: base, override: null, dateStr };
  if (ov.action === 'cancel') {
    return { subject: base, override: ov, canceled: true, dateStr };
  } else if (ov.action === 'replace') {
    const sub = subjectsMap[ov.subjectId] || base;
    return { subject: sub, override: ov, replaced: true, dateStr };
  }
  return { subject: base, override: ov, dateStr };
}

const lessons = (d, specificMonday = null) => {
  const list = [];
  for (let i = 0; i < 4; i++) {
    const data = getSlotData(d, i, specificMonday);
    if (data.subject) {
      list.push({ ...data.subject, i, canceled: data.canceled, replaced: data.replaced, override: data.override, dateStr: data.dateStr });
    }
  }
  return list;
};

const tshort = p => p ? p.split(' / ').map(x => {
  const a = x.trim().split(/\s+/);
  return a.length >= 3 ? `${a[0]} ${a[1][0]}. ${a[2][0]}.` : x;
}).join(' / ') : 'преподаватель не указан';

const full = w => (w || '').replace(/^к(\d) · (\d.*)$/,'Корпус $1, ауд. $2').replace(/^к(\d) · /,'Корпус $1, ');

let heroState = '';
function hero() {
  const nm = nowM();
  const curMon = weekMondays[1]; // Real current week Monday
  const todayDow = getTodayDow();
  const Ls = todayDow < 6 ? lessons(todayDow, curMon) : [];

  const cur = Ls.find(l => nm >= M(T[l.i][0]) && nm < M(T[l.i][1]));
  const nxt = Ls.find(l => M(T[l.i][0]) > nm && !l.canceled);

  const info = l => {
    let tag = '';
    if (l.canceled) tag = ' <span class="tag-cancel">Отменена</span>';
    else if (l.replaced) tag = ' <span class="tag-replace">Замена</span>';
    else if (l.type) tag = ` (${l.type})`;
    return `<div><div class="h-nm">${l.name}${tag}</div><div class="h-pl">${l.place || '—'}</div></div>`;
  };

  let lbl, main, cd='', pr='', then='';
  if (cur) {
    const left = M(T[cur.i][1]) - nm;
    const pct = Math.round((nm - M(T[cur.i][0])) / 90 * 100);
    heroState = 'live';
    lbl = cur.canceled ? 'Идёт пара (отменена)' : 'Идёт сейчас';
    main = info(cur);
    cd = `<b>${left}</b><span>мин до конца</span>`;
    pr = `<div class="pr"><i style="width:${pct}%"></i></div>`;
    if (nxt) then = `Дальше в ${T[nxt.i][0]}: ${nxt.short || nxt.name}, ${nxt.place || ''}`;
  } else if (nxt) {
    const df = M(T[nxt.i][0]) - nm;
    heroState = 'next';
    lbl = Ls[0] === nxt ? 'Первая пара' : 'Следующая пара';
    main = info(nxt);
    cd = df < 60 ? `<b>${df}</b><span>мин до начала</span>` : `<b>${Math.floor(df/60)}:${pad(df%60)}</b><span>ч до начала</span>`;
  } else {
    heroState = 'done';
    let n = null;
    for (let k = 1; k <= 7 && !n; k++) {
      const d = (todayDow + k) % 7;
      if (d < 6) {
        const dLessons = lessons(d, (todayDow + k >= 7) ? weekMondays[2] : curMon);
        if (dLessons.length) n = { d, k, l: dLessons.find(x => !x.canceled) || dLessons[0] };
      }
    }
    lbl = Ls.length ? 'На сегодня всё' : 'Сегодня пар нет';
    main = `<div><div class="h-nm">${Ls.length ? 'Можно выдыхать 🎉' : 'Выходной'}</div>${n ? `<div class="then" style="margin-top:6px">${n.k == 1 ? 'Завтра' : ACC[n.d][0].toUpperCase() + ACC[n.d].slice(1)} в ${T[n.l.i][0]}: ${n.l.short || n.l.name}, ${n.l.place || ''}</div>` : ''}</div>`;
  }
  const h = $('#hero');
  h.dataset.st = heroState;
  h.innerHTML = `<div class="lbl">${lbl}</div><div class="row">${main}<div class="cd">${cd}</div></div>${pr}${then ? `<div class="then">${then}</div>` : ''}`;
}

  $('#wrng-2').textContent = formatRange(weekMondays[2]);

  document.querySelectorAll('.w-pill').forEach(p => {
    const idx = +p.dataset.w;
    p.setAttribute('aria-selected', idx === selectedWeekIndex);
  });
  $('#w-prev').disabled = selectedWeekIndex <= 0;
  $('#w-next').disabled = selectedWeekIndex >= 2;

$('#w-prev').onclick = () => {

    selectedWeekIndex--;
    dir = 'l';
    render();

};
$('#w-next').onclick = () => {
  if (selectedWeekIndex < 2) {

$('#w-pills').onclick = e => {
  const pill = e.target.closest('.w-pill');

  const idx = +pill.dataset.w;

  dir = idx > selectedWeekIndex ? 'r' : 'l';

function dayView(d) {
  const activeMon = getActiveMonday();

  const isPast = selectedWeekIndex === 0;

  // HW for this day
  const dayHw = homework.filter(h => h.date === dateStr);
  const dayHwCount = dayHw.length;

  if (!Ls.length) {
    return `<div class="dh">
      <h2>${DN[d]}</h2>

  const first = Ls[0].i, last = Ls[Ls.length - 1].i;
  const hints = [];
  if (isPast) {
    hints.push('Прошлая неделя (архив)');
  } else {
    if (first > 0) hints.push(`Первой пары нет, приходить к <b>${T[first][0]}</b>`);
    if (Ls.some(l => l.venue === 's')) hints.push(`<b>Стадион на улице:</b> форма и одежда по погоде`);
    else if (Ls.some(l => l.venue === 'g')) hints.push(`<b>Нужна спортивная форма</b>`);
    if (!hints.length) hints.push(d === 5 ? 'Суббота, финишная прямая' : Ls.length === 4 ? 'Четыре пары подряд, возьми перекус' : `Заканчиваем в ${T[last][1]}`);
  }

  const hwHintStr = dayHwCount > 0 ? ` · ДЗ: ${dayHwCount}` : '';

  let h = `<div class="dh">
    <h2>${DN[d]}</h2>
    <span>${pastPrefix}${Ls.length} ${Ls.length > 1 ? 'пары' : 'пара'} · ${T[first][0]}–${T[last][1]}${hwHintStr}</span>

            <span class="note-state">${hasNote ? 'сохранено' : 'не заполнено'}</span>
          </div>
          <textarea data-k="${k}" placeholder="Личная заметка, тема, что взять с собой…" aria-label="Заметка к паре" autocorrect="on" autocapitalize="sentences">${escapeHtml(noteVal)}</textarea>
          <div class="note-footer">
            <span class="note-hint">Только у вас в браузере</span>
            <button class="note-btn del" data-del="${k}" ${hasNote ? '' : 'style="display:none"'}>Очистить</button>
          </div>
        </div>
      </div></div></div>
      <div class="bar"><i></i></div>
    </article>`;
  }
  return h;
}

/* ---------- Week View ---------- */
function weekView() {
  const activeMon = getActiveMonday();
  const isCurWeek = (selectedWeekIndex === 1);
  let h = '<div class="wk"><span></span>' + DS.map((n, d) => {
    const isTodayCol = isCurWeek && (d === today);
    return `<span class="h${isTodayCol ? ' today' : ''}">${n}</span>`;
  }).join('');

  for (let i = 0; i < 4; i++) {
    h += `<span class="rl">${i+1}</span>`;
    for (let d = 0; d < 6; d++) {
      const slot = getSlotData(d, i);
      const l = slot.subject;
      const hasN = !!notes[noteKey(d, i)];
      const dateStr = addDays(activeMon, d);
      const hasHw = homework.some(hw => hw.date === dateStr && hw.slot === i);

      if (l) {
        const titleStr = slot.canceled ? `[Отменена] ${l.name}` : (slot.replaced ? `[Замена] ${l.name}` : l.name);
        h += `<button class="c v-${l.venue || 'r'}${hasN ? ' cur' : ''}${slot.canceled ? ' canceled' : ''}${hasHw ? ' has-hw' : ''}" data-d="${d}" data-i="${i}" aria-label="${DN[d]}, ${i+1} пара: ${titleStr}">${l.short || l.name}</button>`;
      } else {
        h += `<span class="c e"></span>`;
      }
    }
  }
  return h + `</div><div class="leg"><span class="v-r"><i></i>аудитория</span><span class="v-g"><i></i>спортзал</span><span class="v-s"><i></i>стадион</span></div>`;
}

/* ---------- All Homework View (Tab 'hw') ---------- */
function homeworkView() {
  if (!homework.length) {
    return `<div class="dh"><h2>Домашние задания</h2><span>0 заданий</span></div>
    <div style="background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:32px 16px;text-align:center;margin-top:12px;color:var(--mute);">
      <div style="font-size:2rem;margin-bottom:8px;">🎉</div>
      <p style="font-weight:600;font-size:1rem;color:var(--ink);">Заданий пока нет</p>
      <p style="font-size:.82rem;margin-top:4px;">Когда староста добавит ДЗ, оно появится здесь</p>
    </div>`;
  }

  // Sort: uncompleted first, then completed
  // Inside uncompleted: by due date, then by pair date
  const sorted = [...homework].sort((a, b) => {
    const doneA = !!hwDone[a.id];
    const doneB = !!hwDone[b.id];
    if (doneA !== doneB) return doneA ? 1 : -1;
    const dateA = a.due || a.date;
    const dateB = b.due || b.date;
    if (dateA !== dateB) return dateA.localeCompare(dateB);
    return a.slot - b.slot;
  });

  const pendingCount = sorted.filter(h => !hwDone[h.id]).length;

  let h = `<div class="dh">
    <h2>Домашние задания</h2>
    <span>${pendingCount ? `${pendingCount} к сдаче` : 'Все выполнены 🎉'}</span>
  </div>
  <p class="hint">Задания из расписания на 3 недели. Отмечайте выполненные — они сохраняются на вашем устройстве.</p>`;

  sorted.forEach(hw => {
    const isDone = !!hwDone[hw.id];
    const subj = subjectsMap[hw.subjectId] || null;
    const subjName = subj ? (subj.name + (subj.type ? ` (${subj.type})` : '')) : 'Пара';
    const venue = subj?.venue || 'r';

    // Pair date info
    const [y, m, d] = hw.date.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
    const dow = (dt.getUTCDay() + 6) % 7;
    const dayName = DN[dow] || '';
    const timeStr = T[hw.slot] ? `${T[hw.slot][0]}–${T[hw.slot][1]}` : '';

    let dueBadge = '';
    if (hw.due) {
      const daysLeft = getDaysRemaining(hw.due);
      const isUrgent = daysLeft >= 0 && daysLeft <= 2;
      dueBadge = `<span class="hw-due ${isUrgent ? 'due-urgent' : ''}">сдать до ${formatDue(hw.due)}${isUrgent ? ' ⚠️' : ''}</span>`;
    }

    const linkHtml = hw.link
      ? `<a href="${encodeURI(hw.link)}" target="_blank" rel="noopener noreferrer" class="hw-link-btn" onclick="event.stopPropagation()">Материалы ↗</a>`
      : '';

    h += `<article class="hw-view-item v-${venue}${isDone ? ' is-done' : ''}" data-hwid="${hw.id}">
      <div class="hw-view-top">
        <div>
          <div class="hw-view-title">${escapeHtml(subjName)}</div>
          <div class="hw-view-date">${dayName}, ${d} ${MONTHS_ROD[m - 1]} · ${hw.slot + 1} пара (${timeStr})</div>
        </div>
        <button class="hw-jump-btn" data-jump-date="${hw.date}" data-jump-slot="${hw.slot}">К паре →</button>
      </div>
      <div class="hw-card-body ${isDone ? 'hw-done-text' : ''}" style="margin:8px 0;" id="hw-view-body-${hw.id}">${escapeHtml(hw.text)}</div>
      <div class="hw-card-foot" style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--line);">
        <label class="hw-done-label">
          <input type="checkbox" class="hw-done-check" data-hwid="${hw.id}" ${isDone ? 'checked' : ''}>
          <span>Сделано</span>
        </label>
        <div style="display:flex;align-items:center;gap:8px;">
          ${dueBadge}
          ${linkHtml}
        </div>
      </div>
    </article>`;
  });

  return h;
}

function render() {
  tabs();
  const v = $('#view');
  v.className = dir ? 'in-' + dir : '';
  dir = '';
  if (sel === 'w') {
    v.innerHTML = weekView();
  } else if (sel === 'hw') {
    v.innerHTML = homeworkView();
  } else {
    v.innerHTML = dayView(sel);
  }
  tick();
}

/* Event Delegation for View */
$('#view').addEventListener('click', e => {
  // Click on week grid item
  const c = e.target.closest('.c[data-d]');
  if (c) { sel = +c.dataset.d; dir = 'r'; render(); return; }

  // Jump from HW tab to schedule slot
  const jumpBtn = e.target.closest('[data-jump-date]');
  if (jumpBtn) {
    const jumpDate = jumpBtn.dataset.jumpDate;
    const jumpSlot = +jumpBtn.dataset.jumpSlot;
    const targetMon = getMonday(jumpDate);
    const monIdx = weekMondays.indexOf(targetMon);
    if (monIdx !== -1) {
      selectedWeekIndex = monIdx;
    }
    const [y, m, d] = jumpDate.split('-').map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
    sel = (dt.getUTCDay() + 6) % 7;
    dir = 'r';
    render();
    setTimeout(() => {
      const card = document.querySelector(`.card[data-i="${jumpSlot}"]`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('open');
        card.querySelector('.card-h')?.setAttribute('aria-expanded', 'true');
      }
    }, 150);
    return;
  }

  // Toggle card expand/collapse
  const hd = e.target.closest('.card-h');
  if (hd) {
    const card = hd.parentElement, o = card.classList.toggle('open');
    hd.setAttribute('aria-expanded', o);
    if (o) {
      const ta = card.querySelector('textarea');
      if (ta) setTimeout(() => ta.focus(), 120);
    }
    return;
  }

  // Delete note
  const delBtn = e.target.closest('[data-del]');
  if (delBtn) {
    const k = delBtn.dataset.del;
    delete notes[k];
    saveNotes();
    const card = delBtn.closest('.card');
    if (card) {
      card.classList.remove('has');
      const ta = card.querySelector('textarea');
      if (ta) ta.value = '';
      const st = card.querySelector('.note-state');
      if (st) st.textContent = 'очищено';
      delBtn.style.display = 'none';
    }
    toast('Заметка удалена');
    return;
  }

  // Copy schedule for chat
  if (e.target.id === 'cp') {
    const activeMon = getActiveMonday();
    const dateStr = addDays(activeMon, sel);
    const txt = DN[sel] + ':\n' + lessons(sel).map(l => {
      let mark = '';
      if (l.canceled) mark = ' [ОТМЕНЕНА]';
      else if (l.replaced) mark = ' [ЗАМЕНА]';
      const slotHw = homework.find(hw => hw.date === dateStr && hw.slot === l.i);
      const hwTxt = slotHw ? ` [ДЗ: ${slotHw.text.split('\n')[0]}]` : '';
      return `${l.i + 1}. ${T[l.i][0]} ${l.name}${mark}, ${l.place || ''}${hwTxt}`;
    }).join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(() => toast('Скопировано для чата'), () => toast('Не удалось скопировать'));
  }
});

/* Checkbox toggle for "Сделано" */
$('#view').addEventListener('change', e => {
  const chk = e.target.closest('.hw-done-check');
  if (!chk) return;
  const hwId = chk.dataset.hwid;
  if (!hwId) return;

  if (chk.checked) {
    hwDone[hwId] = true;
    toast('Отмечено как сделанное ✓');
  } else {
    delete hwDone[hwId];
    toast('Снята отметка выполнения');
  }
  saveHwDone();

  // Update UI live without resetting scroll
  document.querySelectorAll(`.hw-done-check[data-hwid="${hwId}"]`).forEach(c => { c.checked = !!hwDone[hwId]; });
  const cardBody = $(`#hw-body-${hwId}`);
  if (cardBody) cardBody.classList.toggle('hw-done-text', !!hwDone[hwId]);
  const viewBody = $(`#hw-view-body-${hwId}`);
  if (viewBody) viewBody.classList.toggle('hw-done-text', !!hwDone[hwId]);
  const viewItem = document.querySelector(`.hw-view-item[data-hwid="${hwId}"]`);
  if (viewItem) viewItem.classList.toggle('is-done', !!hwDone[hwId]);

  // Update badge on HW tab
  const pendingHwCount = homework.filter(h => !hwDone[h.id]).length;
  const badge = document.querySelector('.tab-badge');
  if (badge) {
    badge.textContent = pendingHwCount;
    if (pendingHwCount === 0) badge.style.display = 'none';
  }
});

/* Note editing */
let noteTimer = null;
$('#view').addEventListener('input', e => {
  const t = e.target; if (!t.dataset.k) return;
  const k = t.dataset.k;
  const card = t.closest('.card');
  const val = t.value.trim();
  const st = card?.querySelector('.note-state');
  const delBtn = card?.querySelector('.note-btn.del');

  if (st) st.textContent = 'сохранение…';

  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => {
    if (val) {
      notes[k] = val;
      card?.classList.add('has');
      if (delBtn) delBtn.style.display = 'inline-block';
      if (st) st.textContent = 'сохранено';
    } else {
      delete notes[k];
      card?.classList.remove('has');
      if (delBtn) delBtn.style.display = 'none';
      if (st) st.textContent = 'не заполнено';
    }
    saveNotes();
  }, 300);
});

/* ---------- Live State Clock ---------- */
function tick() {
  hero();
  const nm = nowM();
  const isCurWeek = (selectedWeekIndex === 1);
  if (isCurWeek && sel === today) {
    document.querySelectorAll('.card').forEach(c => {
      const i = +c.dataset.i, s = M(T[i][0]), e = M(T[i][1]);
      c.classList.toggle('now', nm >= s && nm < e);
      c.classList.toggle('past', nm >= e);
      const bar = c.querySelector('.bar i');
      if (bar) bar.style.width = Math.max(0, Math.min(100, (nm - s) / 90 * 100)) + '%';
    });
  }
  document.querySelectorAll('.c.cur').forEach(c => c.classList.remove('cur'));
  if (isCurWeek && sel === 'w' && today < 6) {
    T.forEach((t, i) => {
      if (nm >= M(t[0]) && nm < M(t[1])) {
        document.querySelector(`.c[data-d="${today}"][data-i="${i}"]`)?.classList.add('cur');
      }
    });
  }
}
setInterval(tick, 30000);

/* ---------- Swipes & Keyboard ---------- */
let sx = null, sy = null;
$('#view').addEventListener('touchstart', e => {
  if (e.target.closest('textarea')) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, { passive: true });

$('#view').addEventListener('touchend', e => {
  if (sx === null || sel === 'w' || sel === 'hw') return;
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  sx = null; sy = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    go(dx < 0 ? 1 : -1);
  }
});

function go(s) {
  if (sel === 'w' || sel === 'hw') return;
  const n = sel + s;
  if (n < 0) {
    // Edge transition: swipe right on Monday goes to Saturday of previous week
    if (selectedWeekIndex > 0) {
      selectedWeekIndex--;
      sel = 5;
      dir = 'l';
      render();
    }
    return;
  }
  if (n > 5) {
    // Edge transition: swipe left on Saturday goes to Monday of next week
    if (selectedWeekIndex < 2) {
      selectedWeekIndex++;
      sel = 0;
      dir = 'r';
      render();
    }
    return;
  }
  dir = s > 0 ? 'r' : 'l';
  sel = n;
  render();
}

document.addEventListener('keydown', e => {
  if (/TEXTAREA|INPUT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

/* ---------- Toast & Burst ---------- */
function toast(m) {
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800);
}

function burst(x, y) {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const cs = ['#CF4A2C', '#1F6B4E', '#44505E', '#FF8A6B', '#EDEFEC'];
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('i'), a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 110;
    p.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:7px;height:${5 + Math.random() * 6}px;background:${cs[i%5]};border-radius:2px;pointer-events:none;z-index:99`;
    document.body.appendChild(p);
    p.animate([
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * r}px, ${Math.sin(a) * r + 70}px) rotate(${Math.random() * 540}deg)`, opacity: 0 }
    ], { duration: 850 + Math.random() * 450, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => p.remove();
  }
}

/* ---------- Schedule Data Loader & Sync ---------- */
function applyScheduleData(data) {
  if (!data) return;
  if (Array.isArray(data.bells) && data.bells.length === 4) {
    T = data.bells;
  }
  if (Array.isArray(data.subjects)) {
    subjectsMap = {};
    data.subjects.forEach(s => { subjectsMap[s.id] = s; });
  }

  // Handle template
  if (Array.isArray(data.template) && data.template.length === 6) {
    defaultTemplate = data.template;
  } else if (Array.isArray(data.week) && data.week.length === 6) {
    defaultTemplate = data.week;
  }

  // Handle 3 weeks
  if (data.weeks && typeof data.weeks === 'object') {
    scheduleWeeks = data.weeks;
  } else if (Array.isArray(data.week) && data.week.length === 6) {
    // Migration fallback for old cache
    const curMon = weekMondays[1];
    scheduleWeeks = { [curMon]: { days: data.week } };
  }

  if (Array.isArray(data.overrides)) {
    overrides = data.overrides;
  }
  if (Array.isArray(data.homework)) {
    homework = data.homework;
    // Clean up obsolete keys from localStorage['afk-hw-done']
    const activeHwIds = new Set(homework.map(h => h.id));
    let cleaned = false;
    Object.keys(hwDone).forEach(id => {
      if (!activeHwIds.has(id)) {
        delete hwDone[id];
        cleaned = true;
      }
    });
    if (cleaned) saveHwDone();
  }

  render();
}

// Initial cache render
const cachedSchedule = localStorage.getItem('afk-schedule-cache');
if (cachedSchedule) {
  try {
    applyScheduleData(JSON.parse(cachedSchedule));
  } catch (e) {
    applyScheduleData(DEFAULT_SCHEDULE);
  }
} else {
  applyScheduleData(DEFAULT_SCHEDULE);
}

// Automatic API host detection
const API_BASE = location.origin.includes('github.io')
  ? 'https://fkis.a77831818.workers.dev'
  : '';

async function loadSchedule() {
  const offlineBadge = $('#offline-badge');
  try {
    const res = await fetch(`${API_BASE}/api/schedule`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    applyScheduleData(data);
    localStorage.setItem('afk-schedule-cache', JSON.stringify(data));
    offlineBadge.classList.remove('active');
  } catch (err) {
    console.warn('Network error fetching /api/schedule, using cached schedule:', err);
    offlineBadge.classList.add('active');
  }
}

// Background sync
loadSchedule();
</script>
